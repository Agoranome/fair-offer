# Publishes the fair-meter kit (kit/) to PyPI through a trusted publisher (OIDC), so no token is ever created or
# stored. Run it by hand from Actions → Publish fair-meter to PyPI.
#
# Before the first run, PyPI needs a pending trusted publisher for the project fair-meter: owner Agoranome,
# repository fair-offer, workflow publish-kit.yml, environment pypi. To release a new version, bump it in
# kit/pyproject.toml and kit/fair_meter/__init__.py: PyPI never takes the same version twice.
name: Publish fair-meter to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        working-directory: kit
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[test]"
          pytest -q

      - name: Build
        working-directory: kit
        run: |
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          package=$(python -c "import fair_meter; print(fair_meter.__version__)")
          if [ "$declared" != "$package" ]; then
            echo "::error::pyproject.toml says $declared but fair_meter says $package"
            exit 1
          fi
          python -m build --outdir dist .
          ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: kit/dist/
