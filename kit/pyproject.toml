[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-meter"
version = "0.1.0"
description = "What an x402 seller needs to keep the Fair Offer Standard 0.4: the block, the metered charge, bound receipts, the FO-6 guard and an open receipts ledger."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
eth = ["eth-account>=0.10"]
test = ["pytest>=7", "jsonschema>=4", "eth-account>=0.10"]

[project.urls]
Standard = "https://agoranome.com/standard"
Source = "https://github.com/Agoranome/fair-offer/tree/main/kit"

[tool.setuptools]
packages = ["fair_meter"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
